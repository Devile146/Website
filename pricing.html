<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing - Fahad Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .pricing-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 15px 30px;
        }
        .pricing-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .pricing-header h1 {
            font-size: clamp(26px, 4vw, 36px);
            font-weight: 900;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .pricing-header p {
            color: #c0c0d0;
            font-size: 14px;
        }
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .pricing-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .pricing-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(109,92,255,0.3);
        }
        .pricing-card.featured {
            border-color: rgba(255,215,0,0.5);
            box-shadow: 0 0 25px rgba(255,215,0,0.3);
        }
        .popular-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700, #FF8C42);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }
        .pricing-card h3 {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
        }
        .credits-number {
            font-size: 40px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .credits-label {
            font-size: 13px;
            color: #c0c0d0;
            margin-bottom: 15px;
        }
        .price-section {
            margin: 15px 0;
        }
        .original-price {
            color: #FF4D91;
            text-decoration: line-through;
            font-size: 16px;
            margin-right: 8px;
        }
        .discounted-price {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
        }
        .savings {
            color: #4ade80;
            font-size: 12px;
            margin-top: 5px;
            font-weight: 600;
        }
        .select-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6D5CFF, #FF4D91);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .select-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(109,92,255,0.4);
        }
        
        /* Payment Modal */
        .payment-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .payment-box {
            background: rgba(10,12,30,0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 25px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .payment-box h3 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
        }
        .payment-box .package-info {
            text-align: center;
            color: #FFD700;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .payment-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .payment-method {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .payment-method.selected {
            border-color: #6D5CFF;
            background: rgba(109,92,255,0.2);
        }
        .payment-method i {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .payment-method span {
            font-size: 11px;
            color: #fff;
            display: block;
        }
        .upload-section {
            margin-bottom: 15px;
        }
        .upload-section label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }
        .upload-section input[type="file"] {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4ade80, #00d4ff);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body class="pricing-page">
    <div class="page-background" style="background-image: url('https://raw.githubusercontent.com/Devile146/Website/4fa3ef526aa0cc94243d15dda5061de7fad7e304/Imag1.jpg');"></div>
    <div class="bg-glow-purple"></div>
    <div class="bg-glow-blue"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon">FT</div>
                <div class="logo-text">
                    <span class="logo-name">FAHAD TECH</span>
                    <span class="logo-tagline">Premium Platform</span>
                </div>
            </a>
            <div class="nav-center">
                <a href="index.html" class="nav-link">Home</a>
                <a href="tools.html" class="nav-link">Tools</a>
                <a href="pricing.html" class="nav-link active">Pricing</a>
                <a href="account.html" class="nav-link">Account</a>
            </div>
            <div class="nav-right">
                <span class="credit-display" style="color:#FFD700;font-size:12px;font-weight:700;"></span>
            </div>
        </div>
    </nav>

    <div class="pricing-container">
        <div class="pricing-header">
            <h1>💎 <span class="gradient-text">Credit Packages</span></h1>
            <p>Choose your package and get access to premium tools</p>
        </div>
        <div class="pricing-grid" id="pricingGrid"></div>
    </div>

    <!-- Payment Modal -->
    <div class="payment-modal" id="paymentModal" style="display:none;">
        <div class="payment-box" style="position:relative;">
            <button class="close-modal" onclick="closePaymentModal()">&times;</button>
            <h3>💳 Payment</h3>
            <div class="package-info" id="paymentPackageInfo"></div>
            
            <div id="easypaisaInfo" style="margin-bottom:10px;"></div>
            <div id="jazzcashInfo" style="margin-bottom:10px;"></div>
            <div id="paymentInstructions" style="color:#c0c0d0;font-size:12px;margin-bottom:15px;"></div>
            
            <div class="form-group" style="margin-bottom:12px;">
                <label style="color:#fff;font-size:12px;">Transaction/Reference ID (Optional)</label>
                <input type="text" id="transactionId" placeholder="Enter transaction ID" style="width:100%;padding:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:12px;">
            </div>
            
            <div class="upload-section">
                <label>Upload Payment Screenshot *</label>
                <input type="file" id="screenshotUpload" accept="image/*">
            </div>
            
            <button class="submit-btn" onclick="submitPurchaseRequest()">
                <i class="fas fa-check"></i> Submit Payment Request
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/payment.js"></script>
    <script>
        let selectedPackage = null;
        
        auth.onAuthStateChanged(function(user) {
            if (user) {
                loadUserCredits(user.uid);
                loadPricingPackages();
            } else {
                localStorage.setItem('redirectAfterLogin', 'pricing.html');
                window.location.href = 'auth.html';
            }
        });
        
        async function loadPricingPackages() {
            const container = document.getElementById('pricingGrid');
            
            try {
                const snapshot = await packagesCollection.where('active', '==', true).get();
                
                const packages = [];
                snapshot.forEach(doc => {
                    packages.push({ id: doc.id, ...doc.data() });
                });
                
                container.innerHTML = packages.map((pkg, index) => {
                    const hasDiscount = pkg.originalPrice > pkg.price;
                    
                    return `
                    <div class="pricing-card ${index === 1 ? 'featured' : ''}">
                        ${index === 1 ? '<span class="popular-badge">⭐ MOST POPULAR</span>' : ''}
                        <h3>${pkg.name}</h3>
                        <div class="credits-number">${pkg.credits}</div>
                        <div class="credits-label">Credits</div>
                        <div class="price-section">
                            ${hasDiscount ? `<span class="original-price">Rs. ${pkg.originalPrice}</span>` : ''}
                            <span class="discounted-price">Rs. ${pkg.price}</span>
                        </div>
                        ${hasDiscount ? `<div class="savings">Save Rs. ${pkg.originalPrice - pkg.price}!</div>` : ''}
                        <button class="select-btn" onclick="selectPackage('${pkg.id}', '${pkg.name}', ${pkg.credits}, ${pkg.price})">
                            Select Package
                        </button>
                    </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading packages:', error);
                container.innerHTML = '<p style="color:#fff;text-align:center;">Error loading packages.</p>';
            }
        }
        
        function selectPackage(id, name, credits, price) {
            selectedPackage = { id, name, credits, price };
            
            document.getElementById('paymentPackageInfo').textContent = name + ' - ' + credits + ' Credits - Rs. ' + price;
            document.getElementById('paymentModal').style.display = 'flex';
            loadPaymentSettings();
        }
        
        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }
    </script>
</body>
</html>
