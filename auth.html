<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fahad Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 15px 20px;
        }
        .auth-box {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .auth-box h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .auth-box p {
            text-align: center;
            color: #c0c0d0;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: #6D5CFF;
            box-shadow: 0 0 15px rgba(109,92,255,0.3);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6D5CFF, #FF4D91);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.3s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(109,92,255,0.4);
        }
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #c0c0d0;
        }
        .auth-toggle a {
            color: #FFD700;
            font-weight: 700;
            cursor: pointer;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #c0c0d0;
            font-size: 11px;
        }
        .back-link a {
            color: #6D5CFF;
            font-weight: 600;
        }
        .error-msg {
            background: rgba(255,77,145,0.2);
            border: 1px solid rgba(255,77,145,0.4);
            color: #FF4D91;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 10px;
            display: none;
        }
        .success-msg {
            background: rgba(74,222,128,0.2);
            border: 1px solid rgba(74,222,128,0.4);
            color: #4ade80;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body class="auth-page">
    <div class="page-background" style="background-image: url('https://raw.githubusercontent.com/Devile146/Website/4fa3ef526aa0cc94243d15dda5061de7fad7e304/Imag1.jpg');"></div>
    <div class="bg-glow-purple"></div>
    <div class="bg-glow-blue"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon">FT</div>
                <div class="logo-text">
                    <span class="logo-name">FAHAD TECH</span>
                    <span class="logo-tagline">Premium Platform</span>
                </div>
            </a>
            <div class="nav-right">
                <a href="index.html" style="color:#fff;font-size:12px;font-weight:600;">← Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2 id="authTitle">🔐 Login</h2>
            <p id="authSubtitle">Access your premium tools</p>
            
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="auth-btn" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <div class="auth-toggle">
                    Don't have an account? <a onclick="showRegister()">Register Here</a>
                </div>
                <div class="auth-toggle">
                    <a onclick="showForgot()">Forgot Password?</a>
                </div>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Create password (min 6 characters)">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="registerConfirmPassword" placeholder="Confirm password">
                </div>
                <button class="auth-btn" onclick="handleRegister()">
                    <i class="fas fa-user-plus"></i> Register
                </button>
                <div class="auth-toggle">
                    Already have an account? <a onclick="showLogin()">Login Here</a>
                </div>
            </div>
            
            <!-- Forgot Password -->
            <div id="forgotForm" style="display:none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="forgotEmail" placeholder="Enter your email">
                </div>
                <button class="auth-btn" onclick="handleForgotPassword()">
                    <i class="fas fa-key"></i> Reset Password
                </button>
                <div class="auth-toggle">
                    <a onclick="showLogin()">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('authTitle').textContent = '📝 Register';
            document.getElementById('authSubtitle').textContent = 'Create your free account';
            hideMessages();
        }
        
        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('authTitle').textContent = '🔐 Login';
            document.getElementById('authSubtitle').textContent = 'Access your premium tools';
            hideMessages();
        }
        
        function showForgot() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'block';
            document.getElementById('authTitle').textContent = '🔑 Reset Password';
            document.getElementById('authSubtitle').textContent = 'Enter your email to reset';
            hideMessages();
        }
        
        function hideMessages() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }
        
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }
        
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showError('Please fill all fields');
                return;
            }
            
            const result = await loginUser(email, password);
            
            if (result.success) {
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    const redirect = localStorage.getItem('redirectAfterLogin');
                    if (redirect) {
                        localStorage.removeItem('redirectAfterLogin');
                        window.location.href = redirect;
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);
            } else {
                showError(result.error);
            }
        }
        
        async function handleRegister() {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            
            if (!email || !password || !confirmPassword) {
                showError('Please fill all fields');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            const result = await registerUser(email, password);
            
            if (result.success) {
                showSuccess('Account created! 50 free credits added. Redirecting...');
                setTimeout(() => {
                    const redirect = localStorage.getItem('redirectAfterLogin');
                    if (redirect) {
                        localStorage.removeItem('redirectAfterLogin');
                        window.location.href = redirect;
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1500);
            } else {
                showError(result.error);
            }
        }
        
        async function handleForgotPassword() {
            const email = document.getElementById('forgotEmail').value.trim();
            
            if (!email) {
                showError('Please enter your email');
                return;
            }
            
            const result = await resetPassword(email);
            
            if (result.success) {
                showSuccess(result.message);
            } else {
                showError(result.error);
            }
        }
    </script>
</body>
</html>
